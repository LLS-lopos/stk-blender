name: Packaging Addon
run-name: addon-package
on:
  push:
    branches:
      - master

jobs:
  Zip-Addon:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - name: Zip Addon
        run: |
          zip -rZ bzip2 io_antarctica_scene.zip io_antarctica_scene/
          zip -rZ bzip2 io_scene_spm.zip io_scene_spm/
          zip -rZ bzip2 io_artiste.zip io_artiste/
          
      #- name: Delete old releases
        #env:
          #GH_TOKEN: ${{ github.token }}
        #run: |
          #gh release list --json tagName --jq '.[].tagName' | while read tag; do
            #gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          #done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            io_antarctica_scene.zip
            io_scene_spm.zip
            io_artiste.zip
          tag_name: ${{ github.ref_name }}-${{ github.run_id }}
          name: SuperTuxKart Tools - ${{ github.run_id }}
          body: |
            ## Auto-Generate

            the automatically generated packages are versions under development and exclusively dedicated to testing

            - asset creation addon
            - import/export addon
            - node editor running test for artiste
            - generated from the repository **${{ github.ref_name }}**
            - ID run ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
